name: validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cursor plugin manifests
        run: node scripts/validate-template.mjs
